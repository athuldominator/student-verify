<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Issue Student Degree</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Issue a Student Degree</h1>
    <nav><a href="verify.html">Go to Verification</a></nav>
  </header>

  <main>
    <form id="issueForm">
      <label for="studentName">Student Name</label>
      <input type="text" id="studentName" required />

      <label for="studentId">Student ID</label>
      <input type="text" id="studentId" required />

      <label for="university">University</label>
      <input type="text" id="university" required />

      <label for="course">Course</label>
      <input type="text" id="course" required />

      <label for="degreeId">Degree ID</label>
      <input type="text" id="degreeId" required />

      <button type="submit">Issue Degree</button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
